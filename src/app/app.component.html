<a class="skip-link" href="#contenido">Saltar al contenido</a>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal" [class.is-open]="menuAbierto">
    <div class="sidebar__brand">
      <span class="brand-mark" [innerHTML]="logoHtml"></span>
      <span class="brand-text">
        <strong>Plataforma WhatsApp</strong>
        <small>Crédito automotriz</small>
      </span>
      <button class="icon-btn sidebar__close" type="button" aria-label="Cerrar menú" [innerHTML]="iconXHtml" (click)="cerrarMenu(true)"></button>
    </div>

    <nav class="sidebar__nav">
      <div class="nav-group" *ngFor="let g of NAV">
        <h2 class="nav-group__title">{{ g.grupo }}</h2>
        <ul>
          <li *ngFor="let it of g.items">
            <a class="nav-link" [routerLink]="'/' + it.ruta" routerLinkActive [ariaCurrentWhenActive]="'page'">
              <span [innerHTML]="icon(it.icono, 17)"></span>
              <span>{{ it.label }}</span>
              <span class="count" *ngIf="it.contador && sinLeer > 0" [attr.aria-label]="sinLeer + ' sin leer'">{{ sinLeer }}</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="sidebar__foot">
      <div class="user-chip">
        <span class="avatar" aria-hidden="true">CM</span>
        <span class="user-chip__txt">
          <strong>Camila Mardones</strong>
          <small>Jefa de Contactabilidad</small>
        </span>
      </div>
      <p class="sidebar__note">Maqueta de alcance · datos simulados</p>
    </div>
  </aside>

  <div class="scrim" [hidden]="!menuAbierto" (click)="cerrarMenu()"></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn topbar__burger" type="button" aria-label="Abrir menú" [attr.aria-expanded]="menuAbierto" aria-controls="sidebar" [innerHTML]="iconMenuHtml" (click)="abrirMenu()"></button>
      <div class="topbar__title">
        <h1>{{ chrome.titulo() }}</h1>
        <p>{{ chrome.subtitulo() }}</p>
      </div>
      <div class="topbar__actions" [innerHTML]="accionesHtml" (click)="onTopbarClick($event)"></div>
    </header>

    <main class="content" id="contenido" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>
<div class="modal-root" id="modalRoot" hidden></div>
