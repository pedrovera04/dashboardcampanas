<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAF · Plataforma de comunicación WhatsApp</title>
<meta name="description" content="Maqueta navegable de la plataforma de comunicación comercial y de cobranza por WhatsApp de MAF.">
<link rel="icon" type="image/svg+xml" href="assets/logo-maf.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido</a>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <div class="sidebar__brand">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-text">
        <strong>Plataforma WhatsApp</strong>
        <small>Crédito automotriz</small>
      </span>
      <button class="icon-btn sidebar__close" id="sidebarClose" type="button" aria-label="Cerrar menú"></button>
    </div>

    <nav class="sidebar__nav" id="sidebarNav"></nav>

    <div class="sidebar__foot">
      <div class="user-chip">
        <span class="avatar" aria-hidden="true">CM</span>
        <span class="user-chip__txt">
          <strong>Camila Mardones</strong>
          <small>Jefa de Contactabilidad</small>
        </span>
      </div>
      <p class="sidebar__note">Maqueta de alcance · datos simulados</p>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn topbar__burger" id="burger" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar"></button>
      <div class="topbar__title">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Resumen del mes en curso</p>
      </div>
      <div class="topbar__actions" id="topbarActions"></div>
    </header>

    <main class="content" id="contenido" tabindex="-1">
      <div id="view"></div>
    </main>
  </div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>
<div class="modal-root" id="modalRoot" hidden></div>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/campaigns.js"></script>
<script src="js/views/campaign-new.js"></script>
<script src="js/views/audiences.js"></script>
<script src="js/views/templates.js"></script>
<script src="js/views/journeys.js"></script>
<script src="js/views/inbox.js"></script>
<script src="js/views/agent.js"></script>
<script src="js/views/governance.js"></script>
<script src="js/views/reports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
